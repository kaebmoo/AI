name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-test-secret-key-not-for-prod
      ENVIRONMENT: development
      # app/celery.py requires a Redis URL at import time (test_phase_completion imports it);
      # no Redis server is needed — the URL is never connected to during tests
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_EMAIL_DOMAINS: '["nt.th"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff
      # Only errors that break at runtime: syntax errors + undefined names
      - run: ruff check app mcp_servers --select E9,F63,F7,F82
      - run: pytest tests/unit tests/integration -q --maxfail=5

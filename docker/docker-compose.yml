version: '3.8'

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    environment:
      - DATABASE_URL=sqlite:///./nt_revenue.sqlite # Or postgres in prod
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=gemini
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PostgreSQL (Optional for Dev, Required for Prod)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: nt_revenue
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    command: celery -A app.celery.celery_app worker --loglevel=info
    volumes:
      - ../:/app
    environment:
      - DATABASE_URL=sqlite:///./nt_revenue.sqlite
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - app

volumes:
  redis_data:
  postgres_data:
